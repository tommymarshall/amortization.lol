    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" />
    <script>
      const fontStylesheet = document.querySelector('link[href*="Fredoka"]');
      const stylesheetReady = new Promise((resolve) => {
        if (!fontStylesheet || fontStylesheet.sheet) resolve();
        else {
          fontStylesheet.addEventListener('load', resolve, { once: true });
          fontStylesheet.addEventListener('error', resolve, { once: true });
          window.setTimeout(resolve, 2000);
        }
      });
      Promise.all([
        stylesheetReady,
        new Promise((resolve) => window.setTimeout(resolve, 500)),
      ]).then(() => {
        Promise.all([
          document.fonts.load('700 1em Fredoka'),
          document.fonts.load('500 1em Nunito'),
        ]).then(() => document.documentElement.classList.add('fonts-ready'));
      });
    </script>
