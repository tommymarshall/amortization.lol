<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1e4"/>
      <stop offset=".55" stop-color="#fff7f0"/>
      <stop offset="1" stop-color="#f5efff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".75">
      <stop offset="0" stop-color="#ffc88c" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffc88c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="homeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c5ce7" stop-opacity=".17"/>
      <stop offset="1" stop-color="#6c5ce7" stop-opacity=".01"/>
    </linearGradient>
    <linearGradient id="currentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a3c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f08a3c" stop-opacity=".01"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6c5ce7" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="plotClip"><rect x="683" y="260" width="444" height="186" rx="2"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="330" fill="url(#glow)"/>
  <path d="M0 76L0 0H490Z M1200 176V0H820Z" fill="#f08a3c" fill-opacity=".035"/>
  <path d="M32 598L1168 598" stroke="#6c5ce7" stroke-opacity=".12" stroke-width="2"/>

  <rect x="30" y="28" width="1140" height="574" rx="38" fill="#fff" stroke="#efe9e4" stroke-width="2"/>

  <!-- Wordmark and topic badge -->
  <circle cx="91" cy="85" r="15" fill="#f08a3c" fill-opacity=".17"/>
  <circle cx="91" cy="85" r="7" fill="#f08a3c"/>
  <text x="119" y="96" fill="#2b2d42" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="35" font-weight="700" letter-spacing="-.5">amortization.lol</text>
  <rect x="869" y="62" width="245" height="42" rx="21" fill="#f7f4ff" stroke="#e5defb"/>
  <circle cx="891" cy="83" r="5" fill="#6c5ce7"/>
  <text x="906" y="88" fill="#5d50c3" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">MORTGAGE COMPARISON</text>

  <!-- Headline and supporting copy -->
  <rect x="80" y="161" width="178" height="34" rx="17" fill="#fff3e8"/>
  <text x="97" y="183" fill="#c66a2a" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">A LITTLE MATH</text>
  <text x="78" y="271" fill="#2b2d42" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="63" font-weight="600" letter-spacing="-1.2">Before you move,</text>
  <text x="78" y="342" fill="#2b2d42" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="63" font-weight="600" letter-spacing="-1.2">run the numbers.</text>
  <text x="82" y="394" fill="#646879" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="19" font-weight="600">Compare monthly payments, interest,</text>
  <text x="82" y="422" fill="#646879" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="19" font-weight="600">and payoff timelines side by side.</text>

  <rect x="80" y="460" width="422" height="78" rx="18" fill="#fff7f0" stroke="#f4e9df"/>
  <text x="102" y="494" fill="#686d7c" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="18" font-weight="700">This is why you'll never leave</text>
  <text x="102" y="521" fill="#686d7c" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="14" font-weight="600">your house. Well, now you'll know.</text>

  <!-- Rounded mortgage balance chart -->
  <rect x="617" y="135" width="497" height="384" rx="28" fill="#fffaf6" stroke="#eee7e1" stroke-width="2"/>
  <text x="653" y="183" fill="#2b2d42" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="27" font-weight="600">The long view</text>
  <text x="654" y="207" fill="#858796" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="13" font-weight="600">Two paths. A clearer picture.</text>
  <rect x="1031" y="158" width="49" height="32" rx="16" fill="#f2eeff"/>
  <path d="M1047 177l8-9 8 9M1050 173v8h10v-8" fill="none" stroke="#6c5ce7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g clip-path="url(#plotClip)">
    <rect x="683" y="260" width="444" height="186" fill="url(#grid)"/>
    <g stroke="#d8d5df" stroke-opacity=".78" stroke-width="1">
      <path d="M683 279H1127M683 331H1127M683 383H1127M683 435H1127"/>
      <path d="M683 260V446M794 260V446M905 260V446M1016 260V446M1127 260V446" stroke-opacity=".42"/>
    </g>
    <path d="M684 273 C773 280 835 293 890 312 S1015 356 1128 427 L1128 446 H684Z" fill="url(#homeFill)"/>
    <path d="M684 315 C770 321 838 338 900 357 S1030 399 1128 440 L1128 446 H684Z" fill="url(#currentFill)"/>
    <path d="M684 273 C773 280 835 293 890 312 S1015 356 1128 427" fill="none" stroke="#6c5ce7" stroke-width="5" stroke-linecap="round"/>
    <path d="M684 315 C770 321 838 338 900 357 S1030 399 1128 440" fill="none" stroke="#f08a3c" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 11"/>
    <circle cx="794" cy="284" r="7" fill="#6c5ce7" stroke="#fffaf6" stroke-width="3"/>
    <circle cx="794" cy="326" r="7" fill="#f08a3c" stroke="#fffaf6" stroke-width="3"/>
    <circle cx="986" cy="345" r="6" fill="#6c5ce7" fill-opacity=".44"/>
    <circle cx="986" cy="386" r="6" fill="#f08a3c" fill-opacity=".48"/>
  </g>

  <circle cx="665" cy="475" r="5" fill="#f08a3c"/>
  <text x="679" y="480" fill="#55596b" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="15" font-weight="700">Current loan</text>
  <circle cx="847" cy="475" r="5" fill="#6c5ce7"/>
  <text x="861" y="480" fill="#55596b" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="15" font-weight="700">New home</text>

  <text x="80" y="566" fill="#9294a0" font-family="Nunito, 'Trebuchet MS', Arial, sans-serif" font-size="13" font-weight="700">Curious what a move could cost? Start comparing.</text>
</svg>
